<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nivio Bind — Sign In</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f1e35;--navy-light:#162844;--navy-dark:#0a1525;
  --cream:#F8F7F4;--text:#e2e8f0;--text-muted:#94a3b8;
  --accent:#f59e0b;--accent2:#d97706;--radius:8px;
}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--navy);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;flex-direction:column;}
.portal{width:100%;max-width:420px;}
.portal-header{text-align:center;margin-bottom:36px;}
.brand{font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;}
.product-name{font-size:26px;font-weight:600;color:var(--cream);margin-bottom:8px;}
.product-name span{color:var(--accent);}
.tagline{font-size:14px;color:var(--text-muted);}
.card{background:var(--navy-light);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:32px;}
.error{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#fca5a5;border-radius:6px;padding:10px 12px;font-size:13px;margin-bottom:18px;line-height:1.5;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:13px;font-weight:500;color:var(--text-muted);margin-bottom:6px;}
.field input{width:100%;padding:11px 13px;background:var(--navy-dark);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);color:var(--cream);font-family:inherit;font-size:15px;transition:border-color .15s;}
.field input:focus{outline:none;border-color:var(--accent);}
.field input::placeholder{color:rgba(148,163,184,.5);}
.btn{display:block;width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .15s;margin-top:4px;}
.btn:hover:not(:disabled){background:var(--accent2);transform:scale(0.99);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--text-muted);font-size:13px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.07);}
.sso-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:var(--radius);color:var(--text-muted);font-family:inherit;font-size:14px;font-weight:500;cursor:not-allowed;opacity:.4;margin-bottom:10px;}
.footer{text-align:center;margin-top:22px;font-size:13px;color:var(--text-muted);}
.footer a{color:var(--accent);text-decoration:none;}
.footer a:hover{text-decoration:underline;}
.status-bar{position:fixed;bottom:0;left:0;right:0;padding:7px;text-align:center;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text-muted);background:rgba(10,21,37,.95);border-top:1px solid rgba(255,255,255,.04);}
</style>
</head>
<body>
<div class="portal">
  <div class="portal-header">
    <div class="brand">Nivio</div>
    <h1 class="product-name">Nivio <span>Bind</span></h1>
    <p class="tagline">Automated carrier compliance binding</p>
  </div>
  <div class="card">
    <div class="error" id="err"></div>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="you@company.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="btn">Sign In</button>
    </form>
    <div class="divider">or</div>
    <button class="sso-btn" disabled title="Coming soon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Continue with SSO
    </button>
    <button class="sso-btn" disabled title="Coming soon">
      <svg width="16" height="16" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continue with Google
    </button>
  </div>
  <div class="footer">
    <p><a href="https://niviolab.com">Back to niviolab.com</a></p>
  </div>
</div>
<div class="status-bar">bind.niviolab.com — Nivio Bind v1.0</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(async () => {
  const sb = window.supabase.createClient('https://gbsckggatbyiqajidwtv.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdic2NrZ2dhdGJ5aXFhamlkd3R2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQzMDE2OTYsImV4cCI6MjA4OTg3NzY5Nn0.HpLj_WDIQhi7PRxVit3QIua65piPEqIN1_h35ahwqjk');
  const errEl = document.getElementById('err');
  const btnEl = document.getElementById('btn');
  function setError(msg) { errEl.textContent = msg; errEl.style.display = msg ? 'block' : 'none'; }
  function setLoading(on, label) { btnEl.disabled = on; btnEl.textContent = label || 'Sign In'; }
  async function proceed(session) {
    setLoading(true, 'Checking access…');
    const { data, error } = await sb.rpc('get_my_products');
    if (error || !data?.some(r => r.product === 'bind')) {
      await sb.auth.signOut();
      setError('Your account does not have access to Bind. Contact your administrator.');
      setLoading(false); return;
    }
    window.location.href = '/app';
  }
  const { data: { session } } = await sb.auth.getSession();
  if (session) { proceed(session); return; }
  sb.auth.onAuthStateChange((event, session) => { if (event === 'SIGNED_IN' && session) proceed(session); });
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault(); setError(''); setLoading(true, 'Signing in…');
    const { data, error } = await sb.auth.signInWithPassword({
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
    });
    if (error) { setError(error.message); setLoading(false); return; }
    proceed(data.session);
  });
})();
</script>
</body>
</html>
