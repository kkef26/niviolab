<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivio Lab</title>
  <meta name="description" content="Nivio Lab - Intelligent logistics and routing optimization">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0a; color: #fafafa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 2rem; max-width: 600px; }
    .logo { font-size: 2.5rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.5rem; }
    .logo span { color: #3b82f6; }
    .tagline { font-size: 1.1rem; color: #a1a1aa; margin-bottom: 2rem; }
    .status { display: inline-block; padding: 0.5rem 1.5rem; border: 1px solid #27272a; border-radius: 999px; font-size: 0.875rem; color: #71717a; }
    .status::before { content: ""; display: inline-block; width: 8px; height: 8px; background: #3b82f6; border-radius: 50%; margin-right: 8px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">nivio<span>lab</span></div>
    <p class="tagline">Intelligent logistics optimization</p>
    <div class="status">Coming soon</div>
  </div>
</body>
</html>
